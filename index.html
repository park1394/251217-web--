<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕하세요! 저를 소개합니다</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #e0e0e0; margin-bottom: 20px; }
        h1 { margin: 10px 0; color: #2c3e50; }
        p { color: #7f8c8d; }
        .tags { margin: 20px 0; }
        .tag { background: #3498db; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; margin: 3px; display: inline-block; }
        .contact-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #2c3e50; color: white; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .contact-btn:hover { background: #34495e; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/150" alt="프로필 사진" class="profile-img">
        <h1>박재현</h1>
        <p>배우기를 즐기는 프론트엔드 개발자 지망생입니다. 🚀</p>
        
        <div class="tags">
            <span class="tag">#HTML5</span>
            <span class="tag">#CSS3</span>
            <span class="tag">#JavaScript</span>
            <span class="tag">#Learning</span>
        </div>

        <p>안녕하세요! 저는 새로운 기술을 배우고 그것을 통해 문제를 해결하는 과정에서 즐거움을 느낍니다. 현재는 웹 개발의 기초를 탄탄히 다지고 있습니다.</p>
        
        <a href="mailto:your-email@example.com" class="contact-btn">이메일 보내기</a>
    </div>
</body>
</html>
